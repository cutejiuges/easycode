name: Verify

on:
  workflow_dispatch:
    inputs:
      test_jobs:
        description: Maximum active test commands
        type: choice
        options:
          - '2'
          - '4'
          - '8'
        default: '8'
      app_shards:
        description: App test process shards
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '8'
          - '16'
        default: '4'
      diagnostic_budget:
        description: Total seconds (600 is diagnostic only; acceptance remains below 300)
        type: choice
        options:
          - '300'
          - '600'
        default: '300'
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  branch-governance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source branch
        run: ./scripts/check-branch-name.sh "${{ github.head_ref }}"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run repository verification
        run: make verify TEST_BUDGET=${{ inputs.diagnostic_budget || '300' }} TEST_OPTIONS="--jobs=${{ inputs.test_jobs || '8' }} --shards=${{ inputs.app_shards || '4' }} --output=${{ runner.temp }}/easycode-verification"
      - name: Upload verification timings and test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: ${{ runner.temp }}/easycode-verification
          retention-days: 7
